<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ModuLab{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">🧩 ModuLab</a>
      <nav>
        <a href="/">Home</a>
        <a href="/categories">Categories</a>
        <a href="/api/modules">API</a>
        <form class="search-form" action="/search" method="get">
          <input type="text" name="q" placeholder="Search modules..." value="{{ q or '' }}">
          <button type="submit">Search</button>
        </form>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">
      <span>ModuLab — module distribution platform</span>
    </div>
  </footer>
  <script>
    async function modulabDelete(url, kind) {
      if (!confirm("Delete this " + kind + " permanently? This cannot be undone.")) return;
      const headers = {};
      const token = localStorage.getItem("modulab_admin_token");
      if (token) headers["X-Admin-Token"] = token;
      const res = await fetch(url, { method: "DELETE", headers });
      if (res.ok) { location.reload(); return; }
      if (res.status === 403) {
        const t = prompt("Admin token required for deletion:");
        if (t) { localStorage.setItem("modulab_admin_token", t); location.reload(); return; }
      }
      alert("Delete failed (" + res.status + ")");
    }
  </script>
</body>
</html>
